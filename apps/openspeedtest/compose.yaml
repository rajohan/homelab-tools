services:
  openspeedtest:
    image: docker.io/openspeedtest/latest:latest@sha256:ba63bc8396e5ea334b58b96d925cd173957649935abb88efc9d8ada112cc45f8
    restart: unless-stopped
    mem_limit: '512m'
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - type: volume
        source: openspeedtest-logs
        target: /var/log/letsencrypt
        volume:
          nocopy: true

volumes:
  openspeedtest-logs: {}
